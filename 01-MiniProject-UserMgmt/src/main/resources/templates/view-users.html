<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <!-- adding nav bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Add User</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/view-users">View users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- table to display data -->
        <h1>View Users</h1>
        <div th:if="${msg}" id="successMsg" class="alert alert-success text-center"
            style="position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1050; min-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <span th:text="${msg}"></span>
        </div>

        <div th:if="${users.isEmpty()}" class="alert alert-info text-center">
            No records found
        </div>

        <table class="table" th:if="${!users.isEmpty()}">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Full Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Phone Number</th>
                    <th scope="col">Gender</th>
                    <th scope="col">Date of Birth</th>
                    <th scope="col">SSN</th>
                    <th scope="col">Status</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <th scope="row" th:text="${user.userId}"></th>
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.phoneNumber}"></td>
                    <td th:text="${user.gender}"></td>
                    <td th:text="${user.dob}"></td>
                    <td th:text="${user.ssn}"></td>
                    <td th:text="${user.activeSw}"></td>
                    <td>
                        <a th:href="@{/update-status(id=${user.userId}, status=${user.activeSw == 'Y' ? 'N' : 'Y'})}"
                            th:class="${user.activeSw == 'Y' ? 'btn btn-success btn-sm' : 'btn btn-danger btn-sm'}"
                            th:text="${user.activeSw == 'Y' ? '&#10004;' : '&#10008;'}">
                        </a>
                        <a th:href="@{/edit-user(id=${user.userId})}" class="btn btn-primary btn-sm">Edit</a>
                        <a th:href="@{/delete-user(id=${user.userId})}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        // Auto-hide success message after 5 seconds
        setTimeout(function () {
            var successMsg = document.getElementById('successMsg');
            if (successMsg) {
                successMsg.style.display = 'none';
            }
        }, 5000);
    </script>
</body>

</html>
